# Vellum — minimal frosted glass, adaptive brand accent
cursor:
  size: 22
  style: dot
  fill: "#16181D"
  stroke: "rgba(255,255,255,0.9)"
  click: rings
  ripple: auto
card:
  layout: minimal
  padding: 1.6
  blur: 22
  saturate: 1.4
  background: "rgba(255,255,255,0.72)"
  border: "rgba(16,18,22,0.10)"
  text: "#16181D"
  accent: auto
  radius: 18
  width: 300
  heroWidth: 460
  font: "Inter, -apple-system, system-ui, sans-serif"
camera:
  easing: cubic-bezier(0.22, 1, 0.36, 1)
  defaultScale: 1.35
  zoomDuration: 1.0
  settle: 0.3
movement:
  speed: 0.9
  arc: 0.12
typing:
  delay: 45
timing:
  preClick: 0.35
  postClick: 0.45
  cardDefault: 3.2
  heroDefault: 3.8
